<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>serp.bothost.tech</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#07080c;color:#cbd5e1;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:grid;place-items:center;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
  .bg{
    position:fixed;inset:0;z-index:-1;
    background-image:linear-gradient(to right,rgba(255,255,255,.04) 1px,transparent 1px),
                     linear-gradient(to bottom,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 35%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 35%,transparent 100%);
  }
  .glow{
    position:fixed;inset:0;z-index:-1;
    background:radial-gradient(500px 300px at 50% 30%,rgba(56,189,248,.16),transparent 65%);
  }
  .box{
    width:min(92vw,440px);padding:32px;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 30px 80px -40px rgba(0,0,0,.9);
    backdrop-filter:blur(14px);text-align:center;
  }
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;margin-right:8px;
       box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2.2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  h1{margin:14px 0 6px;font-size:20px;font-weight:600;color:#fff;letter-spacing:-.01em}
  p{margin:0;font-size:13.5px;line-height:1.6;color:#94a3b8}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
       padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.03);
       border:1px solid rgba(255,255,255,.06);margin-top:8px}
  .row span:last-child{color:#e2e8f0}
  .grid{margin-top:20px;text-align:left}
  .tag{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
       color:#6ee7b7;border:1px solid rgba(52,211,153,.25);background:rgba(52,211,153,.08);
       border-radius:999px;padding:4px 11px}
  footer{margin-top:20px;font-size:11px;color:#475569}
</style>
</head>
<body>
<div class="bg"></div><div class="glow"></div>

<main class="box">
  <span class="tag"><span class="dot"></span>server online</span>
  <h1>Веб-интерфейс подключён</h1>
  <p>Пустая заготовка. Здесь появятся админка, статистика и mini app.</p>

  <div class="grid">
    <div class="row"><span>Домен</span><span class="mono">serp.bothost.tech</span></div>
    <div class="row"><span>Порт</span><span class="mono">3000</span></div>
    <div class="row"><span>Аптайм</span><span class="mono" id="up">—</span></div>
    <div class="row"><span>Бот</span><span class="mono" id="bot">—</span></div>
  </div>

  <footer class="mono">GET /health · GET /api/status</footer>
</main>

<script>
async function tick(){
  try{
    const r = await fetch('/api/status'); const d = await r.json();
    const s = Math.floor(d.uptime_sec || 0);
    const h = String(Math.floor(s/3600)).padStart(2,'0');
    const m = String(Math.floor(s%3600/60)).padStart(2,'0');
    const sec = String(s%60).padStart(2,'0');
    document.getElementById('up').textContent = h+':'+m+':'+sec;
    document.getElementById('bot').textContent = d.bot || '—';
  }catch(e){ document.getElementById('up').textContent = 'offline'; }
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
